syntax = "proto3";

package synapse;

import "api/status.proto";

message ListFilesRequest {
  // Directory to list, relative to the data root. Empty means the root itself.
  string path = 1;

  // Recurse into subdirectories.
  bool recursive = 2;
}

message ListFilesResponse {
  message File {
    string path = 1;
    uint64 size = 2;
    int64 created = 3;
    int64 modified = 4;

    // 5 was `string type`, which shipped in @science-corporation/synapse 2.4.0.
    // is_dir does not reuse it: a bool is a varint and a string is
    // length-delimited, so a client generated against 2.4.0 would hit a
    // wire-type mismatch on field 5 rather than simply ignoring a field it
    // does not know. Reserved so nothing can claim the slot again.
    reserved 5;
    reserved "type";

    bool is_dir = 6;
  }
  repeated File files = 1;
}

message WriteFileRequest {
  string path = 1;
  bytes data = 2;
}

message WriteFileResponse {
  string path = 1;
  uint64 bytes_written = 2;
}

message ReadFileRequest {
  string path = 1;

  // Resume point for interrupted downloads
  uint64 start_offset = 2;
}

message ReadFileResponse {
  string path = 1;
  bytes data = 2;
  uint64 start_offset = 3;
  uint64 file_total_length = 4;
}

message DeleteFileRequest {
  string path = 1;
  bool recursive = 2;
}

message DeleteFileResponse {
  string path = 1;
  StatusCode status_code = 2;
}
