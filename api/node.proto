syntax = "proto3";

package synapse;

import "api/nodes/broadband_source.proto";
import "api/nodes/electrical_stimulation.proto";
import "api/nodes/optical_stimulation.proto";
import "api/nodes/spike_detector.proto";
import "api/nodes/spectral_filter.proto";
import "api/nodes/disk_writer.proto";
import "api/nodes/spike_source.proto";
import "api/nodes/spike_binner.proto";
import "api/nodes/application.proto";
import "api/nodes/camera.proto";

enum NodeType {
  kNodeTypeUnknown = 0;
  // kStreamIn = 1;
  // kStreamOut = 2;
  reserved 1, 2;

  kBroadbandSource = 3;
  kElectricalStimulation = 4;
  kOpticalStimulation = 5;
  kSpikeDetector = 6;
  kSpikeSource = 7;
  kSpectralFilter = 8;
  kDiskWriter = 9;
  kSpikeBinner = 10;
  kApplication = 11;
  kCamera = 12;
}

message NodeConfig {
  NodeType type = 1;
  uint32 id = 2;
  
  // StreamOutConfig stream_out = 3;
  // StreamInConfig stream_in = 4;
  reserved 3, 4;
  
  oneof config {
    BroadbandSourceConfig broadband_source = 5;
    ElectricalStimulationConfig electrical_stimulation = 6;
    OpticalStimulationConfig optical_stimulation = 8;
    SpikeDetectorConfig spike_detector = 9;
    SpectralFilterConfig spectral_filter = 10;
    DiskWriterConfig disk_writer = 11;
    SpikeSourceConfig spike_source = 12;
    SpikeBinnerConfig spike_binner = 13;
    ApplicationNodeConfig application = 14;
    CameraConfig camera = 15;
  }
}

message NodeStatus {
  NodeType type = 1;
  uint32 id = 2;

  // StreamOutStatus stream_out = 3;
  // StreamInStatus stream_in = 5;
  reserved 3, 5;
  oneof status {
    BroadbandSourceStatus broadband_source = 4;
    ElectricalStimulationStatus electrical_stimulation = 6;
    ApplicationNodeStatus application = 7;
    OpticalStimulationStatus optical_stimulation = 8;
    DiskWriterStatus disk_writer = 10;
    CameraStatus camera = 11;
  }

  // Common health for every node type. Always set by servers that support it;
  // absent on older firmware.
  NodeHealth health = 12;
}

// Liveness and data-path metrics for one node. Rates and latencies cover the
// server's most recent measurement window: the time between status reads, and
// at least one second. Counters run from when the node last started.
message NodeHealth {
  // The node's worker is running and has completed a pass recently (data in,
  // data out, or a successful hardware read). False when the device is stopped
  // or the worker has stalled or exited.
  bool operational = 1;

  // Pre-release single-rate layout; never shipped in a release.
  reserved 2, 3;

  // Bytes per second entering the node: serialized messages received from the
  // upstream node or, for a source node, raw sample bytes read from hardware.
  double in_bytes_per_second = 4;

  // Bytes per second leaving the node: serialized messages published
  // downstream or, for a sink, bytes handed to its disk writer or hardware.
  double out_bytes_per_second = 5;

  // Time from data entering the node to the resulting output leaving it, over
  // the window. For nodes that batch input, measured from the oldest item in
  // the batch. All 0 when nothing left the node during the window.
  double latency_mean_us = 6;
  double latency_p99_us = 7;
  double latency_max_us = 8;

  // Messages this node lost itself: failed to parse, process, or deliver.
  uint32 dropped_messages = 9;

  // Gaps in the sequence numbers of this node's input: messages that went
  // missing upstream before reaching it. Meaningful only when
  // detects_input_gaps is true (the input carries sequence numbers).
  uint32 missing_input_messages = 10;
  bool detects_input_gaps = 11;

  // Seconds since the node last received or emitted data (or since it started,
  // if it has done neither).
  double seconds_since_last_data = 12;
}

message NodeConnection {
  uint32 src_node_id = 1;
  uint32 dst_node_id = 2;
}
