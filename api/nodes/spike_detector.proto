syntax = "proto3";

package synapse;

message TemplateMatcher {
  repeated uint32 template_uV = 1;
}

message Thresholder {
  // Signed: the sign sets the crossing direction. Negative fires when a sample
  // goes below it (extracellular spikes), positive when a sample goes above it.
  // Zero is invalid. Wire-compatible with the old uint32 for positive values.
  int32 threshold_uV = 1;
}

message SpikeDetectorConfig {
  oneof config {
    Thresholder thresholder = 1;
    TemplateMatcher template_matcher = 2;
  }
  uint32 samples_per_spike = 3;
}
