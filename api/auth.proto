syntax = "proto3";

package synapse;

// Pairing handshake. A caller asks for a token; a human at the device 
// approves or denies after comparing a short code shown both on the
// screen and in the caller's terminal
message AuthRequest {
  // Human-readable identification of the caller, shown on the touchscreen so
  // the approver knows who is asking. Conventionally "user@hostname".
  string client_label = 1;
}

message AuthChallenge {
  // Code shown on device when it receives the auth request
  string code = 1;
  uint32 expires_in_sec = 2;
}

message AuthResult {
  bool granted = 1;

  // Set iff granted. Opaque; the caller stores it and sends it back as
  // an "authorization: Bearer <token>" header on later calls (RFC 6750).
  string token = 2;

  // Set iff denied: "denied" or "timed out".
  string reason = 3;
}

message AuthEvent {
  oneof event {
    AuthChallenge challenge = 1;
    AuthResult result = 2;
  }
}

// A client this device has approved. The touchscreen's own client is never
// listed: revoking it would lock the device's own screen out.
message AuthClient {
  // Stable handle for RevokeAuthClient. Not the token, and cannot be used as one.
  string id = 1;
  string label = 2;
  int64 approved_at_ms = 3;
  int64 last_seen_ms = 4;
  // 0 if the token never expires.
  int64 expires_at_ms = 5;
  // Days from approval until the token expires; 0 = never.
  uint32 lifetime_days = 6;
}

message ListAuthClientsRequest {}

message ListAuthClientsResponse {
  repeated AuthClient clients = 1;
}

message RevokeAuthClientRequest {
  string id = 1;
}

message RevokeAuthClientResponse {}

message SetAuthClientLifetimeRequest {
  string id = 1;
  // Days from approval until the token expires; 0 = never.
  uint32 lifetime_days = 2;
}

message SetAuthClientLifetimeResponse {}
